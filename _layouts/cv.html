---
layout: page
---

{{ content }}

<!-- begin Experience -->
<section>

    <h1><br>Experience</h1>
    <hr />

    {% for year, months in site.data.updates %}
    <div>
        <h3>{{ year }}</h3>
        {% for month, updates in months %}
            <h4>{{ month }}</h4>
            {% for update in updates %}
                <p>{{ update }}</p>
            {% endfor %}
        {% endfor %}
    </div>
    {% endfor %}

</section>
<!-- end Experience -->
